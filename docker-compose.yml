version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: panel_ova
      POSTGRES_USER: panel_ova_user
      POSTGRES_PASSWORD: panel_ova_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: /bin/sh -c "gunicorn panel_ova.wsgi:application --bind 0.0.0.0:${PORT:-5000}"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
