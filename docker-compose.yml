version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: panel_ova
      POSTGRES_USER: panel_ova_user
      POSTGRES_PASSWORD: panel_ova_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: /bin/sh -c "gunicorn panel_ova.wsgi:application --bind 0.0.0.0:${PORT:-5000}"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db

  agenda-updater:
    build: .
    command: /bin/sh -c "python manage.py refresh_agendas --loop --interval-minutes ${AGENDA_REFRESH_INTERVAL_MINUTES:-20}"
    volumes:
      - .:/app
      - media_data:/app/media
    env_file:
      - .env
    environment:
      AUTO_REFRESH_AGENDAS: "0"
    depends_on:
      - db

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:5000
    profiles:
      - tunnel
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
